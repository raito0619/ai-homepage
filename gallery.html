<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ボットの日常 - 動画ギャラリー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    .pagination button {
      background: var(--cyber-primary);
      color: var(--cyber-text);
      border: 1px solid var(--cyber-accent);
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .pagination button:hover {
      background: var(--cyber-accent);
    }
    .pagination button.active {
      background: var(--cyber-accent);
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: var(--cyber-text);
    }
    .cyber-card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: var(--cyber-primary);
    }
  </style>
</head>
<body class="cyberpunk-theme">
  <div class="glitch-container">
    <header class="cyber-header">
      <h1 class="glitch-text" data-text="ボットの日常の中の人の日常">ボットの日常の中の人の日常</h1>
      <p class="cyber-subtitle">AI生成動画ギャラリー</p>
      <nav class="cyber-nav">
        <a href="index.html" class="cyber-button"><i class="fas fa-home"></i> ホーム</a>
        <a href="image-gallery.html" class="cyber-button"><i class="fas fa-images"></i> 画像ギャラリー</a>
      </nav>
    </header>
  </div>

  <main class="cyber-gallery">
    <!-- AI塾生成動画ギャラリー -->
    <section id="ai-juku-videos" class="gallery-section">
      <h2 class="section-title"><i class="fas fa-graduation-cap"></i> AI塾生成動画</h2>
      <div class="cyber-grid" id="videos-grid">
        <!-- 動画カードがここに動的に生成されます -->
      </div>
      <div class="pagination" id="pagination">
        <!-- ページネーションボタンがここに生成されます -->
      </div>
      <div id="loading" class="loading" style="display: none;">
        <i class="fas fa-spinner fa-spin"></i> 読み込み中...
      </div>
    </section>
  </main>

  <footer class="cyber-footer">
    <div class="footer-content">
      <p>&copy; 2025 ボットの日常</p>
      <div class="cyber-social">
        <a href="#" class="cyber-link"><i class="fab fa-tiktok"></i></a>
        <a href="#" class="cyber-link"><i class="fab fa-twitter"></i></a>
        <a href="#" class="cyber-link"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </footer>

  <script>
    // 設定
    const ITEMS_PER_PAGE = 9; // 1ページあたりの表示数を9に変更
    const TOTAL_VIDEOS = 102; // 総動画数（m1.mp4からm102.mp4まで）
    let currentPage = 1;

    // 動画カードを生成する関数
    function createVideoCard(number) {
      return `
        <div class="cyber-card">
          <div class="card-inner">
            <div class="card-front">
              <video autoplay loop muted playsinline>
                <source src="AI塾生成動画/m${number}.mp4" type="video/mp4">
                この動画はお使いのブラウザで再生できません。
              </video>
            </div>
            <div class="card-back">
              <p>動画 ${number}</p>
              <div class="cyber-details">
                <span class="cyber-tag">AI生成</span>
                <span class="cyber-tag">動画</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ページネーションを生成する関数
    function createPagination() {
      const totalPages = Math.ceil(TOTAL_VIDEOS / ITEMS_PER_PAGE);
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      // 前へボタン
      const prevButton = document.createElement('button');
      prevButton.innerHTML = '<i class="fas fa-chevron-left"></i>';
      prevButton.disabled = currentPage === 1;
      prevButton.onclick = () => changePage(currentPage === 1 ? totalPages : currentPage - 1);
      pagination.appendChild(prevButton);

      // ページ番号ボタン
      for (let i = 1; i <= totalPages; i++) {
        const button = document.createElement('button');
        button.textContent = i;
        button.classList.toggle('active', i === currentPage);
        button.onclick = () => changePage(i);
        pagination.appendChild(button);
      }

      // 次へボタン
      const nextButton = document.createElement('button');
      nextButton.innerHTML = '<i class="fas fa-chevron-right"></i>';
      nextButton.disabled = currentPage === totalPages;
      nextButton.onclick = () => changePage(currentPage === totalPages ? 1 : currentPage + 1);
      pagination.appendChild(nextButton);
    }

    // ページを変更する関数
    async function changePage(page) {
      const loading = document.getElementById('loading');
      const videosGrid = document.getElementById('videos-grid');
      
      loading.style.display = 'block';
      videosGrid.style.opacity = '0.5';
      
      currentPage = page;
      const start = (page - 1) * ITEMS_PER_PAGE + 1; // m1.mp4から開始
      const end = Math.min(page * ITEMS_PER_PAGE, TOTAL_VIDEOS);

      // 少し遅延を入れて、ローディング表示を確実に見せる
      await new Promise(resolve => setTimeout(resolve, 300));

      videosGrid.innerHTML = '';
      for (let i = start; i <= end; i++) {
        videosGrid.innerHTML += createVideoCard(i);
      }

      createPagination();
      
      loading.style.display = 'none';
      videosGrid.style.opacity = '1';

      // ページトップにスクロール
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 初期表示
    changePage(1);

    // 自動ページ切り替え（オプション：必要に応じてコメントアウトを解除）
    /*
    setInterval(() => {
      const totalPages = Math.ceil(TOTAL_VIDEOS / ITEMS_PER_PAGE);
      changePage(currentPage === totalPages ? 1 : currentPage + 1);
    }, 30000); // 30秒ごとに次のページに移動
    */
  </script>
</body>
</html>
